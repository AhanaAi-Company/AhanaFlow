# AhanaFlow local baseline
# Single-node (builds the in-repo Dockerfile, which starts backend servers):
#   docker compose --profile single-node up -d --build
#
# This repo does not ship v1_1/, k8s/, reports/, or deploy/secrets/.
# Mount runtime secrets from your secret manager if you use sealed-policy auth.
# Do not commit live keys.

services:
  single-node:
    profiles: ["single-node"]
    build: .
    image: ahanaflow:local
    working_dir: /app
    ports:
      - "9633:9633"
      - "9644:9644"
    volumes:
      - single_node_data:/data
    environment:
      UNIVERSAL_HOST: "0.0.0.0"
      UNIVERSAL_PORT: "9633"
      UNIVERSAL_WAL: "/data/universal_server.wal"
      VECTOR_HOST: "0.0.0.0"
      VECTOR_PORT: "9644"
      VECTOR_WAL: "/data/vector_server.wal"
      AHANAFLOW_LICENSE_KEY: ${AHANAFLOW_LICENSE_KEY:-}
    restart: unless-stopped

volumes:
  single_node_data:
