# AhanaFlow single-node baseline
#   docker compose --profile single-node up -d
#
# Uses Dockerfile CMD (/app/run_servers.sh) which starts the in-tree CLIs:
#   python -m backend.universal_server.cli serve --wal ... --host ... --port ...
#   python -m backend.universal_server.cli serve-vector-v2 --wal ... --host ... --port ...
# This public tree does not ship k8s/, v1_1/, or deploy/secrets/.

services:
  single-node:
    profiles: ["single-node"]
    build: .
    image: ahana-event-streams:branch-33-controlled-deployment-v1.0
    ports:
      - "9633:9633"
      - "9644:9644"
    volumes:
      - single_node_data:/data
    environment:
      UNIVERSAL_HOST: "0.0.0.0"
      UNIVERSAL_PORT: "9633"
      UNIVERSAL_WAL: "/data/universal_server.wal"
      VECTOR_HOST: "0.0.0.0"
      VECTOR_PORT: "9644"
      VECTOR_WAL: "/data/vector_server.wal"
      AHANAFLOW_LICENSE_KEY: ${AHANAFLOW_LICENSE_KEY:-}
    restart: unless-stopped

volumes:
  single_node_data:
