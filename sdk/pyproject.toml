[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ahanaflow"
version = "1.0.0"
description = "AhanaFlow Python SDK. Install from this repository; not published to PyPI yet."
readme = "python/README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AhanaAI", email = "jeremiah@ahanazip.com" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ahanaflow = "ahanaflow._cli:main"

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.packages.find]
where = ["python"]
